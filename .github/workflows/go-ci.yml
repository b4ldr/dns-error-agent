name: Go CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    test-and-build:
        name: Test and Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test ./...

            - name: Run race tests
              run: go test -race ./...

            - name: Build
              run: go build ./...
