name: Go CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    test-and-build:
        name: Test and Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test ./...

            - name: Run race tests
              run: go test -race ./...

            - name: Build
              run: go build ./...

    validate-dashboard:
        name: Validate Grafana Dashboard
        runs-on: ubuntu-latest
        needs: test-and-build
        env:
            DNS_PORT: "5353"
            GRAFANA_PORT: "3000"
            GRAFANA_ADMIN_USER: admin
            GRAFANA_ADMIN_PASSWORD: admin

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Start Docker stack
              run: |
                  docker compose \
                    --env-file deploy/docker/.env.example \
                    -f deploy/docker/docker-compose.yml \
                    up --build -d

            - name: Validate dashboard in Grafana
              env:
                  GRAFANA_URL: http://127.0.0.1:3000
                  GRAFANA_USER: admin
                  GRAFANA_PASSWORD: admin
                  GRAFANA_DASHBOARD_UID: dns-error-agent-overview
                  GRAFANA_DATASOURCE_UID: prometheus
              run: python3 scripts/validate_grafana_dashboard.py

            - name: Show container logs on failure
              if: failure()
              run: |
                  docker compose \
                    --env-file deploy/docker/.env.example \
                    -f deploy/docker/docker-compose.yml \
                    logs --no-color

            - name: Stop Docker stack
              if: always()
              run: |
                  docker compose \
                    --env-file deploy/docker/.env.example \
                    -f deploy/docker/docker-compose.yml \
                    down -v
