name: Release

on:
    push:
        tags:
            - "v[0-9]*"

permissions:
    contents: write

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test -race ./...

    build:
        name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        runs-on: ubuntu-latest
        needs: test

        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                    - goos: linux
                      goarch: arm64
                    - goos: linux
                      goarch: arm
                      goarm: "7"
                    - goos: darwin
                      goarch: amd64
                    - goos: darwin
                      goarch: arm64
                    - goos: windows
                      goarch: amd64
                    - goos: windows
                      goarch: arm64

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Set binary name
              id: name
              run: |
                  BINARY=dns-error-agent
                  SUFFIX=""
                  [ "${{ matrix.goos }}" = "windows" ] && SUFFIX=".exe"
                  GOARM="${{ matrix.goarm }}"
                  ARCH="${{ matrix.goarch }}"
                  if [ -n "$GOARM" ]; then
                      ARCH="${ARCH}v${GOARM}"
                  fi
                  ASSET="${BINARY}_${{ github.ref_name }}_${{ matrix.goos }}_${ARCH}${SUFFIX}"
                  echo "binary=${BINARY}${SUFFIX}" >> "$GITHUB_OUTPUT"
                  echo "asset=${ASSET}"            >> "$GITHUB_OUTPUT"

            - name: Build
              env:
                  CGO_ENABLED: "0"
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  GOARM: ${{ matrix.goarm }}
              run: |
                  go build \
                    -trimpath \
                    -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
                    -o "${{ steps.name.outputs.asset }}" \
                    ./cmd/dns-error-agent

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.name.outputs.asset }}
                  path: ${{ steps.name.outputs.asset }}
                  if-no-files-found: error

    release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: dist/*
