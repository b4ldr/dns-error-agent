services:
  agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: dns-error-agent
    command:
      - -agent-domain
      - ${AGENT_DOMAIN:-agent.example.}
      - -udp
      - :53
      - -tcp
      - :53
      - -metrics-addr
      - :9100
      - -metrics-path
      - /metrics
      - -metrics-zone-label-depth
      - ${METRICS_ZONE_LABEL_DEPTH:-2}
      - -txt
      - ${AGENT_TXT_RESPONSE:-ok}
    ports:
      - ${DNS_PORT:-53}:53/udp
      - ${DNS_PORT:-53}:53/tcp
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: dns-error-agent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dns-error-agent-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - ${GRAFANA_PORT:-80}:3000
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
